[package]
name = "tessera"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "A terminal workspace with an overview of real Claude Code and Codex sessions"

[dependencies]
anyhow = "1"
alacritty_terminal = "0.25"
portable-pty = "0.9"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
