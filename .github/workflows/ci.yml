name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tessera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_id=$(cargo pkgid --locked)
          package_version=${package_id##*#}
          package_version=${package_version##*@}
          test "$RELEASE_TAG" = "v$package_version"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --include-ignored
      - run: cargo build --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/bundle-macos.sh scripts/prepare-sparkle.sh
      - run: sh -n install.sh scripts/package-linux.sh
      - name: Lint installer and Linux packaging
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/package-linux.sh
      - name: Build release Linux archive
        if: runner.os == 'Linux'
        run: sh scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Tessera-${{ matrix.os }}
          path: dist/Tessera-linux-*.tar.gz
          if-no-files-found: error
      - name: Build release macOS DMG
        if: runner.os == 'macOS'
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SPARKLE_ED25519_PRIVATE_KEY || '' }}
        run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Tessera-${{ matrix.os }}
          path: |
            dist/Tessera-*.dmg
            dist/appcast-*.xml
          if-no-files-found: error
  tag-release:
    name: Tag explicitly requested release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag and dispatch signed release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/tag-release.py
  release:
    name: Publish GitHub Release
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Tessera-*
          merge-multiple: true
          path: dist
      - name: Publish installers and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s dist/Tessera-arm64.dmg
          test -s dist/Tessera-x86_64.dmg
          test -s dist/appcast-arm64.xml
          test -s dist/appcast-x86_64.xml
          test -s dist/Tessera-linux-x86_64.tar.gz
          test -s dist/Tessera-linux-arm64.tar.gz
          cp install.sh dist/install.sh
          (cd dist && sha256sum Tessera-*.dmg Tessera-linux-*.tar.gz > SHA256SUMS)
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Tessera $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Tessera $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            dist/Tessera-arm64.dmg dist/Tessera-x86_64.dmg \
            dist/appcast-arm64.xml dist/appcast-x86_64.xml \
            dist/Tessera-linux-x86_64.tar.gz dist/Tessera-linux-arm64.tar.gz \
            dist/SHA256SUMS dist/install.sh --clobber
          gh release edit "$RELEASE_TAG" --draft=false
